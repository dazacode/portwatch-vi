name: Pulse

# Fallback only: the site reads GitHub's Atom feeds directly now. This branch is a single commit
# replaced each time, in case GitHub blocks the feeds.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pulse.mjs "$RUNNER_TEMP/pulse.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace the pulse branch
        run: |
          git config user.name "viportlive-scout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan pulse
          git rm -rfq .
          cp "$RUNNER_TEMP/pulse.json" pulse.json
          # Vercel reads each branch's own vercel.json, so this branch has to opt out itself.
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add pulse.json vercel.json
          git commit -qm "pulse"
          git push -qf origin pulse
