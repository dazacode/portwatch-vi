name: Scout

on:
  schedule:
    - cron: "25 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Upstream's scout does this every three hours, and upstream-sync.yml brings it here. Running it as
      # well would change data/tracker.json, which is kept exactly as upstream wrote it. Set the
      # repository variable OWN_SCOUT to 1 if upstream ever stops, and turn off upstream-sync.yml.
      - name: Refresh projects, find new ones, collect headlines and takedowns
        if: vars.OWN_SCOUT == '1'
        run: node scripts/scout.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

      - name: Refresh the projects only we list
        run: node scripts/added.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record milestones
        run: node scripts/milestones.mjs

      - name: Read independent test reports
        run: node scripts/evidence.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FREE_AI: ${{ vars.FREE_AI }}

      - name: Follow the stream channels projects link to
        run: node scripts/channels.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The site reads data/ from the repo at runtime, so this commit needs no deploy.
      - name: Commit data
        run: |
          git config user.name "viportlive-scout[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "scout: update $(date -u '+%F %H:%M') UTC"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
