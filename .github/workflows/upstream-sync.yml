name: Upstream sync

# Keeps a copy of upstream's tracker, byte for byte. The site reads upstream itself, so this copy is the
# fallback, and what the scripts and milestones work from. Only that one file is taken: their code and
# the rest of the repo have gone another way. What we found ourselves is in data/overrides.json.
on:
  schedule:
    # Off the quarter hours, when GitHub is busiest and drops scheduled runs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Same group as the other data writers, so two jobs never push at once.
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # All of it: from a shallow copy, git can't tell that live-front is behind main, and refuses the push.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Fetch upstream's tracker
        id: upstream
        run: |
          git fetch --no-tags --depth 1 https://github.com/4lwayz/portwatch-vi.git main
          git show FETCH_HEAD:data/tracker.json > "$RUNNER_TEMP/tracker.json"
          git show FETCH_HEAD:assets/js/scoring.js > "$RUNNER_TEMP/scoring.js"
          node scripts/upstream.mjs "$RUNNER_TEMP/tracker.json" "$RUNNER_TEMP/scoring.js"

      - name: Record milestones
        run: node scripts/milestones.mjs

      - name: Commit data
        run: |
          git config user.name "viportlive-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.json data/milestones.json data/scores.json
          if git diff --cached --quiet; then echo "Already up to date."; exit 0; fi
          git commit -m "sync: $(date -u '+%F %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin HEAD:live-front || echo "::warning::live-front has commits of its own, so it was left alone."

      # Last, so the data is in before someone is asked to look.
      - name: Ask for a look at the scoring model
        if: steps.upstream.outputs.drift == 'true'
        run: exit 1
